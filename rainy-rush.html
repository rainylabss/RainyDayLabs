<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rainy Rush 🌧️</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#topbar {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: #111c2d;
  border-bottom: 1px solid rgba(255,255,255,.12);
  position: relative;
  z-index: 20;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 10px 14px;
  background: #273b56;
  color: white;
  font-weight: 800;
  cursor: pointer;
}

button:active {
  transform: scale(.95);
}

#scoreBox {
  text-align: center;
}

#score {
  font-size: 22px;
  font-weight: 900;
}

#game {
  width: 100vw;
  height: calc(100vh - 150px);
  min-height: 400px;
  position: relative;
  overflow: hidden;
  background: #76bd70;
}

#world {
  position: absolute;
  left: 0;
  width: 100%;
  height: 2000px;
  bottom: 0;
}

.row {
  position: absolute;
  width: 100%;
  height: 70px;
  overflow: hidden;
}

.grass {
  background:
    radial-gradient(circle, rgba(255,255,255,.13) 2px, transparent 3px),
    #6eb866;
  background-size: 32px 32px;
}

.road {
  background: #343942;
  border-top: 3px solid rgba(255,255,255,.65);
  border-bottom: 3px solid rgba(255,255,255,.65);
}

.road::after {
  content: "";
  position: absolute;
  top: 33px;
  left: 0;
  width: 100%;
  border-top: 3px dashed rgba(255,255,255,.5);
}

.water {
  background:
    linear-gradient(90deg, rgba(255,255,255,.15) 2px, transparent 2px),
    #3b9dcc;
  background-size: 25px 25px;
}

.car {
  position: absolute;
  width: 58px;
  height: 36px;
  border-radius: 8px;
  top: 17px;
  background: #e85757;
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}

.car::before,
.car::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 8px;
  background: #1b2330;
  bottom: -4px;
  border-radius: 3px;
}

.car::before {
  left: 7px;
}

.car::after {
  right: 7px;
}

.car.alt {
  background: #f2bd48;
}

.car.blue {
  background: #4f9eff;
}

.tree {
  position: absolute;
  font-size: 40px;
  z-index: 2;
  user-select: none;
}

.star {
  position: absolute;
  font-size: 28px;
  z-index: 5;
  user-select: none;
}

#player {
  position: absolute;
  width: 42px;
  height: 48px;
  z-index: 10;
  transform: translate(-50%, -50%);
  transition: left .08s linear, top .08s linear;
}

.head {
  position: absolute;
  width: 19px;
  height: 19px;
  background: #f0b48c;
  border-radius: 50%;
  top: 1px;
  left: 11px;
}

.hair {
  position: absolute;
  width: 22px;
  height: 10px;
  background: #5d3825;
  border-radius: 12px 12px 4px 4px;
  top: 0;
  left: 9px;
}

.body {
  position: absolute;
  width: 27px;
  height: 24px;
  background: #5da6ff;
  border-radius: 10px 10px 6px 6px;
  top: 18px;
  left: 7px;
}

.leg {
  position: absolute;
  width: 9px;
  height: 13px;
  background: #25354e;
  top: 38px;
  border-radius: 4px;
}

.leg.left {
  left: 10px;
}

.leg.right {
  right: 10px;
}

#overlay {
  position: absolute;
  inset: 0;
  background: rgba(8,13,23,.88);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

#overlay.show {
  display: flex;
}

.panel {
  background: #1a2638;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 24px;
  padding: 30px;
  width: min(90%, 360px);
}

.panel h1 {
  margin-top: 0;
}

#controls {
  height: 86px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  background: #111c2d;
}

.control {
  width: 58px;
  height: 55px;
  font-size: 23px;
  padding: 0;
}

@media (max-width: 500px) {
  #game {
    min-height: 350px;
  }

  .control {
    width: 55px;
  }
}
</style>
</head>

<body>

<div id="topbar">
  <button onclick="goHome()">🏠 Home</button>

  <div id="scoreBox">
    <div id="score">0</div>
    <small>RAIN SCORE ⭐</small>
  </div>

  <div>🏆 <span id="highScore">0</span></div>
</div>

<div id="game">

  <div id="world"></div>

  <div id="player">
    <div class="hair"></div>
    <div class="head"></div>
    <div class="body"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1>💥 GAME OVER</h1>
      <p>Your score: <strong id="finalScore">0</strong></p>
      <p>🏆 Best: <strong id="finalHigh">0</strong></p>

      <br>

      <button onclick="startGame()">🔄 PLAY AGAIN</button>
      <button onclick="goHome()">🏠 RAINYVERSE</button>
    </div>
  </div>

</div>

<div id="controls">
  <button class="control" onclick="movePlayer(0,-1)">⬆️</button>
  <button class="control" onclick="movePlayer(-1,0)">⬅️</button>
  <button class="control" onclick="movePlayer(1,0)">➡️</button>
  <button class="control" onclick="movePlayer(0,1)">⬇️</button>
</div>

<script>

const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");

let playerX;
let playerY;
let score;
let cameraY;
let rows = [];
let cars = [];
let stars = [];
let running = false;
let animationFrame;

const ROW_HEIGHT = 70;
const WORLD_ROWS = 45;

function randomType() {

  const number = Math.random();

  if (number < 0.55) return "grass";
  if (number < 0.88) return "road";
  return "water";

}

function createRows() {

  world.innerHTML = "";

  rows = [];
  cars = [];
  stars = [];

  for (let i = 0; i < WORLD_ROWS; i++) {

    let type = randomType();

    if (i < 6) type = "grass";

    const row = document.createElement("div");

    row.className = "row " + type;

    row.style.bottom = (i * ROW_HEIGHT) + "px";

    world.appendChild(row);

    rows.push({
      element: row,
      type: type,
      index: i
    });

    if (type === "grass") {

      if (Math.random() < 0.45) {

        const tree = document.createElement("div");

        tree.className = "tree";
        tree.textContent = "🌳";

        tree.style.left =
          (Math.random() * 80 + 5) + "%";

        tree.style.top = "10px";

        row.appendChild(tree);

      }

    }

    if (type === "road") {

      createCars(row, i);

    }

    if (Math.random() < 0.18 && type !== "water") {

      createStar(row, i);

    }

  }

}

function createCars(row, rowIndex) {

  const amount =
    Math.random() < .5 ? 2 : 3;

  const direction =
    Math.random() < .5 ? 1 : -1;

  for (let i = 0; i < amount; i++) {

    const car =
      document.createElement("div");

    car.className = "car";

    const styles = ["", "alt", "blue"];

    car.classList.add(
      styles[Math.floor(Math.random()*styles.length)]
    );

    let startX;

    if (direction === 1) {

      startX =
        -100 - i * 180 -
        Math.random() * 150;

    } else {

      startX =
        game.clientWidth +
        i * 180 +
        Math.random() * 150;

    }

    car.style.left = startX + "px";

    row.appendChild(car);

    cars.push({
      element: car,
      x: startX,
      y: rowIndex * ROW_HEIGHT,
      direction: direction,
      speed:
        1.5 + Math.random() * 2
    });

  }

}

function createStar(row, rowIndex) {

  const star =
    document.createElement("div");

  star.className = "star";
  star.textContent = "⭐";

  const x =
    10 + Math.random() * 80;

  star.style.left = x + "%";
  star.style.top = "20px";

  row.appendChild(star);

  stars.push({
    element: star,
    xPercent: x,
    row: rowIndex,
    collected: false
  });

}

function updatePlayer() {

  player.style.left =
    playerX + "px";

  player.style.top =
    playerY + "px";

}

function movePlayer(dx, dy) {

  if (!running) return;

  const newX =
    playerX + dx * 48;

  const newY =
    playerY + dy * 52;

  playerX =
    Math.max(
      22,
      Math.min(
        game.clientWidth - 22,
        newX
      )
    );

  playerY =
    Math.max(
      40,
      Math.min(
        game.clientHeight - 25,
        newY
      )
    );

  if (dy < 0) {

    score += 10;

    cameraY += 45;

  }

  if (dy > 0) {

    cameraY =
      Math.max(
        0,
        cameraY - 30
      );

  }

  document.getElementById("score")
    .textContent = score;

  updatePlayer();

  updateCamera();

  checkWater();

  checkStars();

  checkCars();

}

function updateCamera() {

  world.style.transform =
    "translateY(" +
    cameraY +
    "px)";

}

function checkWater() {

  const worldPosition =
    game.clientHeight -
    playerY +
    cameraY;

  const rowNumber =
    Math.floor(
      worldPosition / ROW_HEIGHT
    );

  const row =
    rows[rowNumber];

  if (
    row &&
    row.type === "water"
  ) {

    endGame();

  }

}

function checkStars() {

  const worldPosition =
    game.clientHeight -
    playerY +
    cameraY;

  const rowNumber =
    Math.floor(
      worldPosition / ROW_HEIGHT
    );

  stars.forEach(star => {

    if (
      !star.collected &&
      star.row === rowNumber
    ) {

      const starX =
        game.clientWidth *
        (star.xPercent / 100);

      if (
        Math.abs(
          starX - playerX
        ) < 40
      ) {

        star.collected = true;

        star.element.style.display =
          "none";

        score += 25;

        document.getElementById("score")
          .textContent = score;

      }

    }

  });

}

function checkCars() {

  const playerRect =
    player.getBoundingClientRect();

  cars.forEach(car => {

    const carRect =
      car.element.getBoundingClientRect();

    if (
      playerRect.left <
        carRect.right - 8 &&
      playerRect.right >
        carRect.left + 8 &&
      playerRect.top <
        carRect.bottom - 5 &&
      playerRect.bottom >
        carRect.top + 5
    ) {

      endGame();

    }

  });

}

function updateCars() {

  cars.forEach(car => {

    car.x +=
      car.direction * car.speed;

    if (
      car.direction === 1 &&
      car.x > game.clientWidth + 100
    ) {

      car.x = -120;

    }

    if (
      car.direction === -1 &&
      car.x < -120
    ) {

      car.x =
        game.clientWidth + 100;

    }

    car.element.style.left =
      car.x + "px";

  });

}

function gameLoop() {

  if (!running) return;

  updateCars();

  checkCars();

  animationFrame =
    requestAnimationFrame(gameLoop);

}

function startGame() {

  cancelAnimationFrame(
    animationFrame
  );

  running = true;

  score = 0;

  cameraY = 0;

  playerX =
    game.clientWidth / 2;

  playerY =
    game.clientHeight - 90;

  document.getElementById("score")
    .textContent = "0";

  document.getElementById("overlay")
    .classList.remove("show");

  createRows();

  updatePlayer();

  updateCamera();

  gameLoop();

}

function endGame() {

  if (!running) return;

  running = false;

  cancelAnimationFrame(
    animationFrame
  );

  let highScore =
    Number(
      localStorage.getItem(
        "rainyRushHighScore"
      )
    ) || 0;

  if (score > highScore) {

    highScore = score;

    localStorage.setItem(
      "rainyRushHighScore",
      highScore
    );

  }

  const points =
    Number(
      localStorage.getItem(
        "rainPoints"
      )
    ) || 0;

  localStorage.setItem(
    "rainPoints",
    points + score
  );

  const games =
    Number(
      localStorage.getItem(
        "rainGames"
      )
    ) || 0;

  localStorage.setItem(
    "rainGames",
    games + 1
  );

  document.getElementById(
    "finalScore"
  ).textContent = score;

  document.getElementById(
    "finalHigh"
  ).textContent = highScore;

  document.getElementById(
    "highScore"
  ).textContent = highScore;

  document.getElementById(
    "overlay"
  ).classList.add("show");

}

function goHome() {

  window.location.href =
    "index.html";

}

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowUp"
    ) movePlayer(0,-1);

    if (
      event.key === "ArrowDown"
    ) movePlayer(0,1);

    if (
      event.key === "ArrowLeft"
    ) movePlayer(-1,0);

    if (
      event.key === "ArrowRight"
    ) movePlayer(1,0);

  }
);

document.getElementById(
  "highScore"
).textContent =
  localStorage.getItem(
    "rainyRushHighScore"
  ) || 0;

window.addEventListener(
  "resize",
  function() {

    if (running) {

      playerX =
        Math.min(
          playerX,
          game.clientWidth - 22
        );

      playerY =
        Math.min(
          playerY,
          game.clientHeight - 25
        );

      updatePlayer();

    }

  }
);

startGame();

</script>

</body>
</html>
