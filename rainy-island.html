<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rainy Island 🏝️</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#10263a;
color:white;
text-align:center;
}

.top{
height:70px;
padding:0 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

button{
border:0;
border-radius:13px;
padding:11px 15px;
background:#ffffff18;
border:1px solid #ffffff20;
color:white;
font-weight:800;
cursor:pointer;
}

.world{
position:relative;
width:min(94vw,650px);
height:min(70vh,650px);
margin:auto;
overflow:hidden;
border-radius:30px;
border:4px solid #ffffff22;
background:#56b9d1;
}

.water{
position:absolute;
inset:0;
background:
radial-gradient(circle,#ffffff35 2px,transparent 3px);
background-size:28px 28px;
}

.island{
position:absolute;
left:8%;
top:8%;
width:84%;
height:84%;
border-radius:40%;
background:#83c86d;
box-shadow:
inset 0 0 50px #397a45;
}

.player{
position:absolute;
font-size:35px;
z-index:10;
transition:.1s;
}

.tree{
position:absolute;
font-size:40px;
z-index:3;
}

.treasure{
position:absolute;
font-size:30px;
z-index:5;
cursor:pointer;
transition:.2s;
}

.treasure:hover{
transform:scale(1.3);
}

.info{
padding:15px;
}

.controls{
display:flex;
justify-content:center;
gap:8px;
padding-bottom:20px;
}

.controls button{
width:60px;
height:50px;
font-size:22px;
}

.message{
min-height:25px;
}

</style>

</head>

<body>


<div class="top">

<button onclick="location.href='index.html'">
🏠 RainyVerse
</button>

<b>🏝️ Rainy Island</b>

<span>
💎 <span id="found">0</span>/8
</span>

</div>


<div class="world" id="world">

<div class="water"></div>

<div class="island"></div>

<div class="player" id="player">
🧑
</div>

</div>


<div class="info">

<h3>
🏝️ Explore Rainy Island
</h3>

<p>
Find all 8 hidden treasures!
</p>

<div class="message" id="message"></div>

</div>


<div class="controls">

<button onclick="move(0,-1)">⬆️</button>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(1,0)">➡️</button>
<button onclick="move(0,1)">⬇️</button>

</div>


<script>

const world=
document.getElementById("world");

const player=
document.getElementById("player");

const message=
document.getElementById("message");

const foundText=
document.getElementById("found");


let x=50;
let y=50;
let found=0;


const treasurePositions=[

[25,25],
[45,20],
[70,28],
[75,55],
[55,72],
[30,65],
[20,45],
[60,45]

];


const treePositions=[

[14,15],
[72,15],
[16,70],
[75,68],
[43,12],
[43,75]

];


treePositions.forEach(

position=>{

const tree=
document.createElement("div");

tree.className="tree";

tree.textContent="🌴";

tree.style.left=
position[0]+"%";

tree.style.top=
position[1]+"%";

world.appendChild(tree);

}

);


treasurePositions.forEach(

(position,index)=>{

const treasure=
document.createElement("div");

treasure.className="treasure";

treasure.textContent="💎";

treasure.dataset.id=index;

treasure.style.left=
position[0]+"%";

treasure.style.top=
position[1]+"%";

treasure.onclick=
function(){

collectTreasure(treasure);

};

world.appendChild(treasure);

}

);


function render(){

player.style.left=
x+"%";

player.style.top=
y+"%";

}


function move(dx,dy){

x+=dx*4;
y+=dy*4;

x=Math.max(
12,
Math.min(82,x)
);

y=Math.max(
12,
Math.min(82,y)
);

render();

checkNearby();

}


function checkNearby(){

document
.querySelectorAll(".treasure")
.forEach(treasure=>{

if(treasure.style.display==="none"){
return;
}

const tx=
parseFloat(treasure.style.left);

const ty=
parseFloat(treasure.style.top);

if(
Math.abs(tx-x)<5 &&
Math.abs(ty-y)<5
){

collectTreasure(treasure);

}

});

}


function collectTreasure(treasure){

if(treasure.dataset.collected){
return;
}

treasure.dataset.collected="true";

treasure.style.display="none";

found++;

foundText.textContent=found;

const points=
Number(localStorage.getItem("rainPoints"))||0;

localStorage.setItem(
"rainPoints",
points+25
);

message.textContent=
"💎 Treasure found! +25 RainPoints";

if(found===8){

message.textContent=
"🎉 YOU FOUND ALL 8 TREASURES! 🏆";

}

}


document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowUp")
move(0,-1);

if(e.key==="ArrowDown")
move(0,1);

if(e.key==="ArrowLeft")
move(-1,0);

if(e.key==="ArrowRight")
move(1,0);

}
);


render();

</script>

</body>
</html>
